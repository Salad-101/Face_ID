<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Face Recognition</title>
        <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
        <script defer src="{{ url_for('static', filename='script.js') }}"></script>
    </head>
    <body>
        <div class="wrapper">
            <div class="video-container">
                <img id="videoFeed" src="" alt="Camera Feed">
                <div class="controls">
                    <button id="toggleBtn">Start Detection</button>
                    <span id="statusIndicator" class="stopped">Stopped</span>
                </div>
                <p id="faces">Found 0 faces | FPS: 0</p>
            </div>

            <div class="register-form">
                <h2>Register Face</h2>
                <input type="text" id="nameInput" placeholder="Full Name">
                <input type="date" id="dobInput" placeholder="Date of Birth">
                <input type="text" id="nidInput" placeholder="National ID">
                <button id="registerBtn">Register Unknown</button>
                <p id="status"></p>
            </div>
        </div>
    </body>
</html>
