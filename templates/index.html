<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Recognition</title>
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<div class="wrapper">
  <div class="video-container">
    <img id="videoFeed" src="" alt="Camera Feed">
    <div class="controls">
      <button id="toggleBtn">Start Detection</button>
      <span id="statusIndicator" class="stopped">Stopped</span>
    </div>
    <p id="faces">Found 0 faces | FPS: 0</p>
  </div>

  <div class="register-form">
    <h2>Register Face</h2>
    <input type="text" id="nameInput" placeholder="Full Name">
    <input type="date" id="dobInput" placeholder="Date of Birth">
    <input type="text" id="nidInput" placeholder="National ID">
    <button id="registerBtn">Register Unknown</button>
    <p id="status"></p>
  </div>
</div>

<script>
const toggleBtn = document.getElementById('toggleBtn');
const facesText = document.getElementById('faces');
const videoFeed = document.getElementById('videoFeed');
const status = document.getElementById('status');
const statusIndicator = document.getElementById('statusIndicator');

let detecting = false, updateInterval = null;
let lastTime = Date.now();

function startDetection() {
  detecting = true;
  toggleBtn.textContent = "Stop Detection";
  statusIndicator.textContent = "Detecting";
  statusIndicator.classList.remove("stopped");
  statusIndicator.classList.add("detecting");

  videoFeed.src = "/video_feed";

  updateInterval = setInterval(async ()=>{
    const res = await fetch("/faces_count");
    const data = await res.json();

    const now = Date.now();
    const fps = (1000 / (now - lastTime)).toFixed(1);
    lastTime = now;

    facesText.textContent = `Found ${data.faces} face${data.faces!==1?'s':''} | FPS: ${fps}`;
  }, 500);
}

function stopDetection() {
  detecting = false;
  toggleBtn.textContent = "Start Detection";
  statusIndicator.textContent = "Stopped";
  statusIndicator.classList.remove("detecting");
  statusIndicator.classList.add("stopped");

  facesText.textContent = "Found 0 faces | FPS: 0";
  videoFeed.src = "";  // actually stops the feed
  clearInterval(updateInterval);
}

toggleBtn.addEventListener("click", ()=> detecting ? stopDetection() : startDetection());

document.getElementById('registerBtn').addEventListener("click", async ()=>{
  const name = document.getElementById("nameInput").value.trim();
  const dob = document.getElementById("dobInput").value;
  const nid = document.getElementById("nidInput").value.trim();
  if(!name){status.textContent="Enter name to register."; return;}
  const form = new FormData();
  form.append("name", name);
  form.append("dob", dob);
  form.append("nid", nid);
  const res = await fetch("/register_face", {method:"POST", body:form});
  const data = await res.json();
  status.textContent = data.message;
});
</script>
</body>
</html>
