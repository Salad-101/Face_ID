<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Face Detection Preview</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #0e0e0e;
      color: #f0f0f0;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }

    .wrapper {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 50px;
    }

    .video-container {
      position: relative;
      width: 640px;
      height: 480px;
      border: 3px solid #00ff88;
      border-radius: 10px;
      overflow: hidden;
      box-shadow: 0 0 15px #00ff88;
    }

    img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 10px;
    }

    .controls {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 15px;
    }

    h1 {
      color: #00ff88;
      margin-bottom: 10px;
    }

    #toggleBtn {
      background-color: #00ff88;
      color: #0e0e0e;
      border: none;
      padding: 12px 25px;
      font-size: 18px;
      border-radius: 8px;
      cursor: pointer;
      transition: 0.3s;
      box-shadow: 0 0 10px #00ff88;
    }

    #toggleBtn.active {
      background-color: #0e0e0e;
      color: #00ff88;
      box-shadow: 0 0 25px #00ff88;
      border: 2px solid #00ff88;
    }

    #toggleBtn:hover {
      transform: scale(1.05);
    }

    #status {
      margin-top: 15px;
      font-size: 18px;
      color: #bbb;
      text-align: center;
      transition: color 0.3s;
    }

    #status.active {
      color: #00ff88;
    }

    #status.inactive {
      color: #ff4c4c;
    }

    #faces {
      font-size: 18px;
      color: #00ff88;
      margin-top: 10px;
    }
  </style>
</head>
<body>
  <div class="wrapper">
    <!-- Left: Camera Feed -->
    <div class="video-container">
      <img id="videoFeed" src="" alt="Camera Feed" />
    </div>

    <!-- Right: Controls -->
    <div class="controls">
      <h1>Face Detection</h1>
      <button id="toggleBtn">Start Detection</button>
      <p id="status" class="inactive">Click "Start Detection" to begin</p>
      <p id="faces">Found 0 faces</p>
    </div>
  </div>

  <script>
    const toggleBtn = document.getElementById('toggleBtn');
    const statusText = document.getElementById('status');
    const facesText = document.getElementById('faces');
    const videoFeed = document.getElementById('videoFeed');
    let detecting = false;
    let updateInterval = null;

    function startDetection() {
      detecting = true;
      toggleBtn.textContent = "Stop Detection";
      toggleBtn.classList.add("active");
      statusText.textContent = "Detection running...";
      statusText.classList.remove("inactive");
      statusText.classList.add("active");

      // Start video feed
      videoFeed.src = "/video_feed";

      // Update face count every 500ms
      updateInterval = setInterval(async () => {
        const res = await fetch("/faces_count");
        const data = await res.json();
        facesText.textContent = `Found ${data.faces} face${data.faces !== 1 ? 's' : ''}`;
      }, 500);
    }

    function stopDetection() {
      detecting = false;
      toggleBtn.textContent = "Start Detection";
      toggleBtn.classList.remove("active");
      statusText.textContent = "Detection stopped.";
      statusText.classList.remove("active");
      statusText.classList.add("inactive");

      facesText.textContent = "Found 0 faces";
      videoFeed.src = "";
      clearInterval(updateInterval);
    }

    toggleBtn.addEventListener("click", () => {
      if (!detecting) startDetection();
      else stopDetection();
    });
  </script>
</body>
</html>
